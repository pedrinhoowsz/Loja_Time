spring.application.name=loja-backend
server.port=8082

# ---------- Banco de dados (MySQL) ----------
# Os valores abaixo podem ser trocados por variaveis de ambiente (DB_URL, DB_USER, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loja_time?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:il785612}

# As tabelas sao criadas/atualizadas automaticamente pelo Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mostra a mensagem dos erros (ex.: "Email ja cadastrado") para o frontend
server.error.include-message=always
server.error.include-binding-errors=never

# Para rodar SEM instalar MySQL use o perfil h2:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2

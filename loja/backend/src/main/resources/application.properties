spring.application.name=loja-backend
server.port=8082

# Le as senhas de um arquivo .env (fora do git). Veja loja/.env.example
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- Banco de dados (MySQL) ----------
# Configure DB_URL, DB_USER e DB_PASSWORD no .env ou como variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loja_time?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Endereco publico do backend, usado para montar a URL das fotos dos produtos
loja.url-publica=${LOJA_URL_PUBLICA:http://localhost:8082}

# As tabelas sao criadas/atualizadas automaticamente pelo Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mostra a mensagem dos erros (ex.: "Email ja cadastrado") para o frontend
server.error.include-message=always
server.error.include-binding-errors=never

# Para rodar SEM instalar MySQL use o perfil h2:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-icon">⚽</span>
      <h2>Faça seu login</h2>
      <p>Acesse sua conta para finalizar pedidos</p>
    </div>

    @if (erro) {
      <div class="alert alert-warning">{{ erro }}</div>
    }

    <form (ngSubmit)="entrar()" #f="ngForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" name="email" [(ngModel)]="email"
               autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" type="password" class="form-control" name="senha" [(ngModel)]="senha"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-team w-100 mb-3" [disabled]="loading || f.invalid">
        @if (loading) { Entrando... } @else { Entrar }
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/reenvio">Esqueci minha senha</a>
      <span>|</span>
      <a routerLink="/cadastro">Faça seu cadastro</a>
    </div>
  </div>
</div>

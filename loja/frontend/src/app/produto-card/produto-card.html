<div class="card card-product h-100">
  <a [routerLink]="['/detalhe', produto.id]" class="foto">
    <img [src]="produto.imagem" [alt]="produto.nome" loading="lazy">
  </a>
  <div class="card-body d-flex flex-column">
    <span class="team-badge mb-2 align-self-start">{{ produto.time }}</span>
    <h5 class="card-title">{{ produto.nome }}</h5>
    <p class="card-text text-muted small mb-1">{{ produto.categoria }}</p>
    <p class="price-tag mt-auto">{{ produto.preco | currency: 'BRL' }}</p>
    <a [routerLink]="['/detalhe', produto.id]" class="btn btn-team btn-sm w-100">Ver detalhes</a>
  </div>
</div>
